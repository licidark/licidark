name: Build EXE

on: 
  workflow_dispatch: 
  push: 
    branches: 
      - main
jobs: 
  build: 
    runs-on: windows-latest

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Install Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Build EXE
    run: npx electron-packager . LICI-DARK --platform=win32 --arch=x64 --out=dist --overwrite

  - name: Upload EXE
    uses: actions/upload-artifact@v4
    with:
      name: LICI-DARK-Windows
      path: dist/
